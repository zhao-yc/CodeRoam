plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'io.dcloud.uts.kotlin' }
android {
 namespace 'org.example.codexmobile'
 compileSdk 34
 defaultConfig { applicationId 'org.example.codexmobile'; minSdk 21; targetSdk 34; versionCode 108; versionName '0.1.8'; ndk { abiFilters 'arm64-v8a','armeabi-v7a' }
 def easyCom = [
 [class:'uts.sdk.modules.DCloudUniActionSheet.UniActionSheetExtApiPagesRegister',method:'register'],
 [class:'uts.sdk.modules.DCloudUniModal.UniModalExtApiPagesRegister',method:'register'],
 [class:'uts.sdk.modules.DCloudUniShowLoading.UniShowLoadingExtApiPagesRegister',method:'register'],
 [class:'uts.sdk.modules.DCloudUniLoading.UniLoadingExtApiComponentsRegister',method:'register']
 ]
 buildConfigField 'String', 'UTSEasyCom', groovy.json.JsonOutput.toJson(groovy.json.JsonOutput.toJson(easyCom))
 buildConfigField 'String', 'UTSRegisterComponents', '"[]"'
 buildConfigField 'String', 'UTSRegisterProviders', '"[]"'
 buildConfigField 'String[]', 'UTSHooksClassArray', '{}'
 }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 kotlinOptions { jvmTarget='1.8' }
 buildFeatures { buildConfig true }
 aaptOptions { additionalParameters '--auto-add-overlay'; ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~' }
 packagingOptions { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }; jniLibs { useLegacyPackaging false } }
}
dependencies {
 implementation fileTree(dir:'libs',include:['*.aar'])
 implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.28'
 implementation 'androidx.core:core-ktx:1.10.1'
 implementation 'androidx.appcompat:appcompat:1.6.1'
 implementation 'androidx.recyclerview:recyclerview:1.3.2'
 implementation 'androidx.exifinterface:exifinterface:1.3.6'
 implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
 implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
 implementation 'androidx.webkit:webkit:1.6.0'
 implementation 'com.google.android.material:material:1.10.0'
 implementation 'androidx.viewpager2:viewpager2:1.1.0-beta02'
 implementation 'com.alibaba:fastjson:1.2.83'
 implementation 'com.facebook.fresco:fresco:3.4.0'
 implementation 'com.facebook.fresco:middleware:3.4.0'
 implementation 'com.facebook.fresco:animated-gif:3.4.0'
 implementation 'com.facebook.fresco:webpsupport:3.4.0'
 implementation 'com.facebook.fresco:animated-webp:3.4.0'
 implementation 'com.caverock:androidsvg:1.4'
 implementation 'com.github.bumptech.glide:glide:4.16.0'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
 implementation 'org.jetbrains.kotlin:kotlin-reflect:2.2.0'
 implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.4.1'
 implementation 'com.squareup.okhttp3:okhttp:3.12.12'
 implementation 'com.github.getActivity:XXPermissions:18.63'
 implementation 'net.lingala.zip4j:zip4j:2.11.5'
}
